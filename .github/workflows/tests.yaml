name: Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
  schedule:
    # A twice-monthly schedule (1st and 15th at 03:00 UTC)
    - cron: "0 3 1,15 * *"

jobs:
  tests:
    uses: ./.github/workflows/juju-setup.yaml
    with:
      command: |
          set -euo pipefail
          echo "Starting COS device setup workflow"

          echo "Cloning rob-cos-overlay and applying terraform"
          git clone https://github.com/ubuntu-robotics/rob-cos-overlay.git
          cd rob-cos-overlay/terraform/rob-cos
          terraform init
          terraform apply -auto-approve -var="model=testing"
          # Due to https://github.com/canonical/cos-registration-server-k8s-operator/issues/59
          sleep 60
          juju remove-relation cos-registration-server:database postgresql:database
          while true; do
            if juju integrate cos-registration-server:database postgresql:database; then
              echo "Relation integration succeeded"
              break
            fi

            echo "Relation integration failed; retrying in 60s"
            sleep 60
          done
          cd "${GITHUB_WORKSPACE}"
          if [ -z "${METALLB_IPADDR:-}" ]; then
            echo "METALLB_IPADDR is not set"
            exit 1
          fi

          rob_cos_base_url="http://${METALLB_IPADDR}/testing"
          registration_api_path="cos-registration-server/api/v1"
          api_base_url="${rob_cos_base_url}-${registration_api_path}"

          cos_registration_port_forward_pid=""
          cleanup_port_forward() {
            if [ -n "${cos_registration_port_forward_pid}" ] && kill -0 "${cos_registration_port_forward_pid}" 2>/dev/null; then
              kill "${cos_registration_port_forward_pid}" || true
              wait "${cos_registration_port_forward_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup_port_forward EXIT

          wait_for_health() {
            local target_api_base_url="$1"
            local timeout_seconds="$2"
            local start_time now elapsed status_code
            start_time="$(date +%s)"

            while true; do
              status_code="$(curl -s -o /dev/null -w "%{http_code}" "${target_api_base_url}/health/" || true)"
              if [ "${status_code}" = "200" ]; then
                echo "Health endpoint is ready for ${target_api_base_url}."
                return 0
              fi

              now="$(date +%s)"
              elapsed="$((now - start_time))"
              if [ "${elapsed}" -ge "${timeout_seconds}" ]; then
                echo "Health endpoint did not return 200 within ${timeout_seconds}s for ${target_api_base_url} (last status: ${status_code})."
                return 1
              fi

              sleep 10
            done
          }

          echo "Waiting for registration server health endpoint via MetalLB IP"
          if ! wait_for_health "${api_base_url}" 300; then
            echo "MetalLB endpoint unavailable, falling back to localhost port-forward"
            sudo microk8s kubectl -n testing port-forward pod/cos-registration-server-0 18081:8000 >/tmp/cos_registration_port_forward.log 2>&1 &
            cos_registration_port_forward_pid="$!"
            sleep 2

            if ! kill -0 "${cos_registration_port_forward_pid}" 2>/dev/null; then
              echo "Failed to start cos-registration-server port-forward"
              exit 1
            fi

            rob_cos_base_url="http://localhost:18081/testing"
            api_base_url="${rob_cos_base_url}-${registration_api_path}"
            if ! wait_for_health "${api_base_url}" 300; then
              juju status --relations
              exit 1
            fi
          fi

          echo "Running device setup script as root"
          device_uid="robot-001"
          printf '%s\n%s\n' "${device_uid}" "${rob_cos_base_url}" | sudo bash ./setup-robcos-device.sh

          echo "Validating device registration"
          devices_response="$(curl -fsS "${api_base_url}/devices/")"
          jq -e 'type == "array" and length == 1 and .[0].uid == "robot-001"' <<<"${devices_response}" >/dev/null

          echo "Verifying expected snaps are installed"
          expected_snaps=(
            rob-cos-demo-configuration
            rob-cos-data-sharing
            cos-registration-agent
            ros2-exporter-agent
            foxglove-bridge
            rob-cos-grafana-agent
          )

          for snap_name in "${expected_snaps[@]}"; do
            echo "Verifying ${snap_name} is installed"
            snap list "${snap_name}" >/dev/null
          done

          echo "Verifying expected snap service states"
          is_service_enabled() {
            unit_name="$1"
            expected_enabled="$2"
            actual_enabled="$(systemctl is-enabled "${unit_name}" || true)"
            if [ "${expected_enabled}" = "enabled" ] && [ "${actual_enabled}" = "static" ]; then
              return 0
            fi
            if [ "${actual_enabled}" != "${expected_enabled}" ]; then
              echo "Unexpected enabled state for ${unit_name}: expected ${expected_enabled}, got ${actual_enabled}"
              exit 1
            fi
          }

          is_service_active() {
            unit_name="$1"
            expected_active="$2"
            actual_active="$(systemctl is-active "${unit_name}" || true)"
            if [ "${actual_active}" != "${expected_active}" ]; then
              echo "Unexpected active state for ${unit_name}: expected ${expected_active}, got ${actual_active}"
              exit 1
            fi
          }

          expected_units=(
            "snap.cos-registration-agent.update-device-configuration.service|enabled|inactive"
            "snap.ros2-exporter-agent.auto-clean.service|enabled|inactive"
            "snap.ros2-exporter-agent.daily-rotation.service|enabled|inactive"
            "snap.ros2-exporter-agent.read-configuration.service|enabled|inactive"
            "snap.ros2-exporter-agent.recorder.service|enabled|active"
            "snap.ros2-exporter-agent.synchronization.service|enabled|inactive"
            "snap.foxglove-bridge.config-from-content-snap.service|enabled|inactive"
            "snap.foxglove-bridge.foxglove-bridge.service|enabled|active"
            "snap.rob-cos-grafana-agent.grafana-agent.service|enabled|active"
          )

          sleep 30 # Give enough time to everything to settle
          for unit_spec in "${expected_units[@]}"; do
            IFS='|' read -r unit_name expected_enabled expected_active <<<"${unit_spec}"
            is_service_enabled "${unit_name}" "${expected_enabled}"
            is_service_active "${unit_name}" "${expected_active}"
          done

          echo "All checks passed"
